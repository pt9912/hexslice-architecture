# a-check configuration — hexagonal + vertical-slice (HexSlice) architecture gate.
# https://github.com/pt9912/a-check   (requires a-check >= v0.15.0)
#
# Strictly decoded: unknown keys cause exit code 2.
#
# The per-slice app globs (.../createorder/**) and per-port-folder globs
# (.../ports/**) use clean literal directory prefixes on purpose. That prefix is
# what makes the two vertical-slice rules active:
#   - lateral-slice: one slice must not import another slice of the same app layer
#   - port-locality: a use-case-local port must only be used within its own slice
# A wildcard-in-the-middle (.../**/ports/**) or file-extension (.../*.go) glob
# carries no such prefix and would leave both rules silently inert.
version: 1

languages:
  go: ["**/*.go"]

layers:
  domain:
    globs: ["internal/hexagon/domain/**"]
    role: domain
  ports:
    globs:
      - "internal/hexagon/application/order/createorder/ports/**"   # use-case-local
      - "internal/hexagon/application/order/cancelorder/ports/**"   # use-case-local
      - "internal/hexagon/application/order/ports/**"               # business-area-shared
    role: port
  app:
    globs:
      - "internal/hexagon/application/order/createorder/**"          # slice: create order
      - "internal/hexagon/application/order/cancelorder/**"          # slice: cancel order
    role: app
  adapters:
    globs: ["internal/adapters/**"]
    role: adapter

# Allowed directed dependencies (inward only). Any cross-layer import without a
# matching edge is reported as `wrong-direction`.
edges:
  - {from: app,      to: domain}
  - {from: app,      to: ports}
  - {from: ports,    to: domain}
  - {from: adapters, to: app}      # inbound CLI adapter drives the use cases
  - {from: adapters, to: domain}   # adapters map to/from domain objects
# Note: outbound adapters *implement* the ports, but via Go interface
# satisfaction (structural, no import), so there is no adapters->ports import
# edge to declare — the wiring happens in the composition root (cmd/**).

# The composition root wires adapters to slices and is exempt from layer rules.
composition_root: ["cmd/**"]

# Tests are not part of the production dependency graph.
exclude:
  - "**/*_test.go"
